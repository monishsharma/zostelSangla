
name: Zostel Sangla Availability Check

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

jobs:
  check-availability:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Check Zostel availability
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ZOSTEL_API_TOKEN: ${{ secrets.ZOSTEL_API_TOKEN }}
          ZOSTEL_CLIENT_APP_ID: ${{ secrets.ZOSTEL_CLIENT_APP_ID }}
          ZOSTEL_CLIENT_USER_ID: ${{ secrets.ZOSTEL_CLIENT_USER_ID }}
        run: npm run check
